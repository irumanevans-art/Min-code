name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# 同一分支上新的提交到来时，取消还在跑的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 本仓库的测试一直在 Windows 上跑（路径、换行、shell 引号的用例都按它验证过），CI 先和本地保持同一环境。
# 要换 Linux 先在本地的 Linux 上把 agent 与 app 的单测跑绿，再改这里。
jobs:
  agent:
    name: agent 模块（源码检查 + 单测）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      # 先跑便宜的机械检查：runCatching 禁令与文件行数（见 build-logic/AgentSourceCheck 和 agent/file-size-baseline.txt）
      - name: agentSourceCheck
        shell: bash
        run: ./gradlew agentSourceCheck
      - name: agent 单测
        shell: bash
        run: >-
          ./gradlew
          :agent:protocol:test :agent:spi:test :agent:store:test :agent:policy:test :agent:context:test
          :agent:llm:test :agent:mcp:test :agent:lsp:test :agent:tools:test :agent:ext:test
          :agent:host:test :agent:otel:test :agent:kernel:test :agent:cli:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: agent-test-reports
          path: agent/*/build/reports/tests/test/

  app:
    name: app（单测 + assembleDebug）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: app 单测
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :highlight:testDebugUnitTest :workspace:testDebugUnitTest
      - name: assembleDebug
        shell: bash
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-test-reports
          path: app/build/reports/tests/
